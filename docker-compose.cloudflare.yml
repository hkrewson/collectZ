# Opt-in Cloudflare Tunnel overlay for the local source-built CollectZ stack.
#
# Cloudflare dashboard route:
#   Hostname: the value of CLOUDFLARE_HOSTNAME
#   Service:  http://frontend:3000
#
# Start with:
#   docker compose --env-file .env --env-file .env.cloudflare \
#     -f docker-compose.yml -f docker-compose.localhost.yml \
#     -f docker-compose.cloudflare.yml up -d --build

services:
  backend:
    environment:
      ALLOWED_ORIGINS: https://${CLOUDFLARE_HOSTNAME:?Set CLOUDFLARE_HOSTNAME in .env.cloudflare},http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
      TRUST_PROXY: ${TUNNEL_TRUST_PROXY:-1}
      # The current local Nginx hop reports HTTP to Express even when Cloudflare
      # serves HTTPS. Keep this false for the temporary development tunnel.
      SESSION_COOKIE_SECURE: ${TUNNEL_SESSION_COOKIE_SECURE:-false}

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - ${CLOUDFLARED_LOG_LEVEL:-info}
      - --metrics
      - 0.0.0.0:2000
      - run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env.cloudflare}
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - internal
    expose:
      - "2000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

